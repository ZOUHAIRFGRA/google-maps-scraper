version: "3.9"

x-gmapssaas-image: &gmapssaas-image
  build:
    context: .
    dockerfile: Dockerfile.saas
  image: gmapssaas-local:latest

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gmapssaas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gmapssaas"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg_data_v2:/var/lib/postgresql/data

  migrate:
    <<: *gmapssaas-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD:-CHANGE_ME_STRONG} dbname=gmapssaas sslmode=disable connect_timeout=10"
    command: ["migrate"]
    restart: "no"

  api:
    <<: *gmapssaas-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ADDR: :8080
      DATABASE_URL: "host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD:-CHANGE_ME_STRONG} dbname=gmapssaas sslmode=disable connect_timeout=10"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0398d4cad290e145cb8242bb74e045264564d384d33ada80ff7702e460e6956c}
      DISABLE_API_KEY_AUTH: "true"
    command: ["serve"]
    ports:
      - "8080:8080"

  worker:
    <<: *gmapssaas-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD:-CHANGE_ME_STRONG} dbname=gmapssaas sslmode=disable connect_timeout=10"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0398d4cad290e145cb8242bb74e045264564d384d33ada80ff7702e460e6956c}
      CONCURRENCY: "4"
      RIVER_MAX_WORKERS: "20"
    command: ["worker"]

volumes:
  pg_data_v2:
